name: Ultron Max Android CI & APK Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Attempt signed Release APK build (requires keystore GitHub Secrets)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build-apk:
    name: Unit Tests & APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Verify Android SDK & Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          fi
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Keystores
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi
          if [ ! -f app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\r\n' | base64 --decode > app/google-services.json
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-max-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK Artifact
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-max-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release APK (Optional)
        id: release_build
        if: |
          github.event_name != 'pull_request' &&
          (github.event_name == 'push' || inputs.build_release == true)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "release_built=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping signed release APK."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon --stacktrace
          rm -f "$KEYSTORE_PATH"
          echo "release_built=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup Release Keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/release-upload.jks"

      - name: Upload Signed Release APK
        if: steps.release_build.outputs.release_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ultron-max-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: |
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ultron-max-build-{0}', github.run_number) }}
          name: Ultron Max v2.0.0 (Build #${{ github.run_number }})
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk

      - name: Write Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ultron Max Android Build Summary"
            echo "- **Debug APK**: Built and uploaded (\`:app:assembleDebug\`)"
            echo "- **Unit & Robolectric Tests**: Executed (\`:app:testDebugUnitTest\`)"
            if [ "${{ steps.release_build.outputs.release_built }}" = "true" ]; then
              echo "- **Release APK**: Signed and uploaded (\`:app:assembleRelease\`)"
            else
              echo "- **Release APK**: Skipped (configure \`RELEASE_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` secrets to enable signed release builds)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
